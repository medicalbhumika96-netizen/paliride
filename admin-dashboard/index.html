<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pali Ride – Admin Panel</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="admin.css">
</head>

<body>

<header>
  <h2>🚖 Pali Ride – Admin Control</h2>
</header>

<div class="stats">
  <div class="stat">
    <span id="rideCount">0</span>
    <small>Total Rides</small>
  </div>
  <div class="stat red">
    <span id="emgCount">0</span>
    <small>Emergency</small>
  </div>
  <div class="stat green">
    <span id="driverCount">0</span>
    <small>Drivers Online</small>
  </div>
  <div class="stat blue">
    ₹<span id="collection">0</span>
    <small>Today Collection</small>
  </div>
</div>

<section>
  <h3>🚑 Emergency Rides</h3>
  <div id="emergency"></div>
</section>

<section>
  <h3>📦 Live Rides</h3>
  <div id="rides"></div>
</section>

<audio id="alarm">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script src="admin.js"></script>
</body>
</html>
