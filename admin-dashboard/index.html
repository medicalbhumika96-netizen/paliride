<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Pali Ride – Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0
    }

    .card {
      background: #fff;
      margin: 12px;
      padding: 12px;
      border-radius: 10px
    }

    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #0a7cff;
      color: #fff
    }

    .status {
      font-weight: bold
    }
  </style>
</head>

<body>

  <h3 style="text-align:center">Admin – Rides</h3>
  <div id="list"></div>

  <script>
    async function load() {
      const rides = await fetch("https://paliride.onrender.com/api/admin/rides").then(r => r.json());
      const drivers = await fetch("https://paliride.onrender.com/api/admin/drivers").then(r => r.json());

      const box = document.getElementById("list");
      box.innerHTML = "";
      rides.forEach(r => {
        box.innerHTML += `
    <div class="card">
      <div><b>${r.pickup}</b> → ${r.drop}</div>
      <div class="status">Status: ${r.status}</div>
      ${r.status === "requested" ? `
        <select id="d${r._id}">
          ${drivers.map(d => `<option value="${d._id}">${d.name}</option>`)}
        </select>
        <button class="btn" onclick="assign('${r._id}')">Assign</button>
      `: ""}
    </div>`;
      });
    }

    function assign(rideId) {
      const driverId = document.getElementById("d" + rideId).value;
      fetch("https://paliride.onrender.com/api/admin/assign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rideId, driverId })
      }).then(() => load());
    }

    load();
  </script>
</body>

</html>
