<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pali Ride – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:#0f172a;
  color:#fff;
}
.header{
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:600;
}
.card{
  background:#1e293b;
  margin:12px;
  padding:14px;
  border-radius:16px;
}
input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:8px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0a7cff;
  color:#fff;
  font-size:15px;
}
.small{
  padding:8px 12px;
  margin-top:8px;
}
.ride{
  margin-bottom:10px;
}
.status{
  font-size:13px;
  opacity:.85;
}
</style>
</head>

<body>

<div class="header">🛠 Pali Ride – Admin</div>

<!-- CREATE RIDE -->
<div class="card">
  <h4>Create Ride (WhatsApp / Manual)</h4>
  <input id="ap" placeholder="Pickup">
  <input id="ad" placeholder="Drop">
  <select id="av">
    <option value="bike">Bike</option>
    <option value="auto">Auto</option>
  </select>
  <input id="af" type="number" placeholder="Fare">
  <button class="btn" onclick="create()">Create Ride</button>
</div>
<div>Payment: ${r.paymentMode} (${r.paymentStatus})</div>

<!-- RIDES -->
<div id="list"></div>

<script>
async function load(){
  const rides=await fetch("https://paliride.onrender.com/api/admin/rides").then(r=>r.json());
  const drivers=await fetch("https://paliride.onrender.com/api/admin/drivers").then(r=>r.json());
  const box=document.getElementById("list");
  box.innerHTML="";

  rides.forEach(r=>{
    box.innerHTML+=`
    <div class="card ride">
      <b>${r.pickup}</b> → ${r.drop}<br>
      ₹${r.fare} • ${r.vehicleType}
      <div class="status">Status: ${r.status}</div>

      ${r.status==="requested"?`
        <select id="d${r._id}">
          ${drivers.map(d=>`<option value="${d._id}">${d.name}</option>`)}
        </select>
        <button class="btn small" onclick="assign('${r._id}')">Assign Driver</button>
      `:""}
    </div>`;
  });
}

function assign(id){
  fetch("https://paliride.onrender.com/api/admin/assign",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      rideId:id,
      driverId:document.getElementById("d"+id).value
    })
  }).then(()=>load());
}

function create(){
  fetch("https://paliride.onrender.com/api/ride/create",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      pickup:ap.value,
      drop:ad.value,
      vehicleType:av.value,
      fare:Number(af.value)
    })
  }).then(()=>{ ap.value="";ad.value="";af.value="";load(); });
}

load();
</script>

</body>
</html>
