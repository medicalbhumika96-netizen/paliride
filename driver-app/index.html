<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pali Ride – Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#f4f6f8;
  margin:0;
}
.header{
  background:#0a7cff;
  color:#fff;
  padding:12px;
  text-align:center;
}
.card{
  background:#fff;
  margin:12px;
  padding:14px;
  border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
}
.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
  font-size:15px;
}
.accept{background:#28a745;color:#fff}
.complete{background:#17a2b8;color:#fff}
.toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.badge{
  font-weight:bold;
  margin-top:6px;
}
</style>
</head>
<body>

<div class="header">
  🚖 Driver Panel
</div>

<div class="card">
  <input id="driverId" placeholder="Enter Driver ID" style="width:100%;padding:10px">
  <div class="toggle">
    <span>Status:</span>
    <input type="checkbox" id="avail" onchange="setAvail()">
  </div>
</div>

<div id="rides"></div>

<script>
let currentDriver="";

function setAvail(){
  currentDriver = driverId.value.trim();
  if(!currentDriver) return alert("Driver ID required");

  fetch("https://paliride.onrender.com/api/driver/availability",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      driverId: currentDriver,
      isAvailable: avail.checked
    })
  });
}

function load(){
  if(!currentDriver) return;

  fetch(`https://paliride.onrender.com/api/driver/${currentDriver}/rides`)
  .then(r=>r.json())
  .then(data=>{
    const box=document.getElementById("rides");
    box.innerHTML="";
    data.forEach(r=>{
      box.innerHTML+=`
      <div class="card">
        <div><b>${r.pickup}</b> → ${r.drop}</div>
        <div class="badge">Fare: ₹${r.fare}</div>
        <div class="badge">Status: ${r.status}</div>

        ${r.status==="assigned" ? 
          `<button class="btn accept" onclick="act('${r._id}','accept')">Accept Ride</button>` 
          : ""
        }

        ${r.status==="accepted" ? 
          `<button class="btn complete" onclick="act('${r._id}','complete')">Complete Ride</button>` 
          : ""
        }
      </div>`;
    });
  });
}

function act(id,type){
  fetch(`https://paliride.onrender.com/api/driver/${type}`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ rideId:id })
  }).then(()=>load());
}

// auto refresh every 6 sec
setInterval(load,6000);
</script>

</body>
</html>
