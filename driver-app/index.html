<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pali Ride – Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:#020617;
  color:#fff;
}
.header{
  text-align:center;
  padding:16px;
  font-size:20px;
  font-weight:600;
}
.card{
  background:#111827;
  margin:12px;
  padding:16px;
  border-radius:18px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  font-size:16px;
  margin-top:8px;
}
.accept{ background:#22c55e; color:#000 }
.complete{ background:#0a7cff }
</style>
</head>

<body>

<div class="header">🚖 Pali Ride – Driver</div>
<div>Payment: <b>${r.paymentMode.toUpperCase()}</b></div>

<div id="rides"></div>

<script>
const driverId="DRIVER_ID_HERE"; // future login

function load(){
  fetch(`https://paliride.onrender.com/api/driver/${driverId}/rides`)
  .then(r=>r.json())
  .then(data=>{
    const box=document.getElementById("rides");
    box.innerHTML="";
    data.forEach(r=>{
      box.innerHTML+=`
      <div class="card">
        <b>${r.pickup}</b> → ${r.drop}<br>
        Fare: ₹${r.fare}<br>
        Status: ${r.status}

        ${r.status==="assigned"?
          `<button class="btn accept" onclick="act('${r._id}','accept')">Accept Ride</button>`:""}

        ${r.status==="accepted"?
          `<button class="btn complete" onclick="act('${r._id}','complete')">Complete Ride</button>`:""}
      </div>`;
    });
  });
}

function act(id,type){
  fetch(`https://paliride.onrender.com/api/driver/${type}`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ rideId:id })
  }).then(()=>load());
}

setInterval(load,4000);
load();
</script>

</body>
</html>
