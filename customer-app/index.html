<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pali Ride</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#0a7cff,#4f46e5);
  display:flex;
  align-items:center;
  justify-content:center;
}
.app{
  width:100%;
  max-width:380px;
  background:rgba(255,255,255,.96);
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.header{
  text-align:center;
  margin-bottom:16px;
}
.header h2{
  margin:0;
  font-size:22px;
}
.header span{
  font-size:13px;
  color:#555;
}
.input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:12px;
  font-size:15px;
}
.vehicle{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}
.vehicle button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:2px solid #ddd;
  background:#fff;
  font-size:15px;
}
.vehicle button.active{
  border-color:#0a7cff;
  background:#eef5ff;
}
.fares{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}
.fares button{
  flex:1 1 30%;
  padding:10px;
  border-radius:12px;
  border:2px solid #ddd;
  background:#fff;
  font-weight:bold;
}
.fares button.active{
  background:#0a7cff;
  color:#fff;
  border-color:#0a7cff;
}
.primary{
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  font-size:16px;
  background:#0a7cff;
  color:#fff;
  margin-bottom:10px;
}
.whatsapp{
  background:#22c55e;
}
.footer{
  text-align:center;
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h2>🚕 Pali Ride</h2>
    <span>Pali ka apna local ride</span>
  </div>

  <input id="pickup" class="input" placeholder="Pickup location">
  <input id="drop" class="input" placeholder="Drop location">

  <div class="vehicle">
    <button id="bike" class="active" onclick="setVehicle('bike')">🏍 Bike</button>
    <button id="auto" onclick="setVehicle('auto')">🛺 Auto</button>
  </div>

  <div class="fares">
    <button onclick="setFare(40)">₹40</button>
    <button onclick="setFare(60)">₹60</button>
    <button onclick="setFare(80)">₹80</button>
    <button onclick="setFare(100)">₹100</button>
    <button onclick="setFare(120)">₹120</button>
  </div>
  <div class="vehicle">
  <button id="cash" class="active" onclick="setPay('cash')">💵 Cash</button>
  <button id="upi" onclick="setPay('upi')">📲 UPI</button>
</div>


  <button class="primary" onclick="bookRide()">Confirm Ride</button>
  <button class="primary whatsapp" onclick="wa()">📲 Book via WhatsApp</button>

  <div class="footer">
    Trusted local drivers • Fixed fare • No surge
  </div>
</div>
<div id="statusBox"></div>

<script>
let vehicle="bike";
let fare=40;
let paymentMode="cash";
let rideId=null;

function setVehicle(v){
  vehicle=v;
  bike.classList.remove("active");
  auto.classList.remove("active");
  document.getElementById(v).classList.add("active");
}

function setFare(f){
  fare=f;
  document.querySelectorAll(".fares button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
}

function setPay(p){
  paymentMode=p;
  cash.classList.remove("active");
  upi.classList.remove("active");
  document.getElementById(p).classList.add("active");
}

function bookRide(){
  fetch("https://paliride.onrender.com/api/ride/create",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      pickup:pickup.value,
      drop:drop.value,
      vehicleType:vehicle,
      fare,
      paymentMode
    })
  })
  .then(r=>r.json())
  .then(d=>{
    rideId=d.rideId;
    statusBox.innerHTML="🔍 Searching for driver...";
    poll();
  });
}

function poll(){
  const t=setInterval(()=>{
    fetch("https://paliride.onrender.com/api/ride/status/"+rideId)
    .then(r=>r.json())
    .then(d=>{
      statusBox.innerHTML="🚖 Status: "+d.status;
      if(d.status==="completed") clearInterval(t);
    });
  },3000);
}
</script>

</body>
</html>
