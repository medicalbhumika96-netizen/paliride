<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pali Ride</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="costmer.css">
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">🚕 Pali Ride</div>
  <div class="tag">Rajasthan ka apna ride</div>
</div>

<!-- APP -->
<div class="app hidden" id="app">

  <header>
    <h2>Pali Ride</h2>
    <span>Select your ride</span>
  </header>

  <!-- RIDE MODES -->
  <div class="modes">
    <div class="mode active" onclick="selectMode('student')">🎓 Student</div>
    <div class="mode" onclick="selectMode('office')">🏢 Office</div>
    <div class="mode emergency" onclick="selectMode('emergency')">🚑 Emergency</div>
    <div class="mode" onclick="selectMode('night')">🌙 Night</div>
    <div class="mode" onclick="selectMode('village')">🌾 Village</div>
  </div>

  <!-- INPUTS -->
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Mobile Number">
  <input id="pickup" placeholder="Pickup Location">
  <input id="drop" placeholder="Drop Location">

  <!-- VEHICLE -->
  <div class="switch">
    <button id="bike" class="active" onclick="setVehicle('bike')">🏍 Bike</button>
    <button id="auto" onclick="setVehicle('auto')">🛺 Auto</button>
  </div>

  <!-- PAYMENT -->
  <div class="switch">
    <button id="cash" class="active" onclick="setPay('cash')">💵 Cash</button>
    <button id="upi" onclick="setPay('upi')">📲 UPI</button>
  </div>

  <button class="primary" onclick="bookRide()">Confirm Ride</button>

  <div id="statusBox" class="status hidden"></div>

</div>

<script src="costmer.js"></script>
</body>
</html>
