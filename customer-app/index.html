<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pali Ride</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#0a7cff,#4f46e5);
  display:flex;
  align-items:center;
  justify-content:center;
}
.app{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.header{text-align:center;margin-bottom:16px}
.header h2{margin:0;font-size:22px}
.header span{font-size:13px;color:#555}

.input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:12px;
  font-size:15px;
}

.vehicle,.fares{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.vehicle button,.fares button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:2px solid #ddd;
  background:#fff;
  font-weight:bold;
}
button.active{
  border-color:#0a7cff;
  background:#eef5ff;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  font-size:16px;
  background:#0a7cff;
  color:#fff;
  margin-bottom:10px;
}
.whatsapp{background:#22c55e}

#statusBox{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:#f3f4f6;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h2>🚕 Pali Ride</h2>
    <span>Pali ka apna local ride</span>
  </div>

  <input id="pickup" class="input" placeholder="Pickup location">
  <input id="drop" class="input" placeholder="Drop location">

  <div class="vehicle">
    <button id="bike" class="active" onclick="setVehicle('bike')">🏍 Bike</button>
    <button id="auto" onclick="setVehicle('auto')">🛺 Auto</button>
  </div>

  <div class="fares">
    <button onclick="setFare(40)">₹40</button>
    <button onclick="setFare(60)">₹60</button>
    <button onclick="setFare(80)">₹80</button>
    <button onclick="setFare(100)">₹100</button>
    <button onclick="setFare(120)">₹120</button>
  </div>

  <div class="vehicle">
    <button id="cash" class="active" onclick="setPay('cash')">💵 Cash</button>
    <button id="upi" onclick="setPay('upi')">📲 UPI</button>
  </div>

  <button class="primary" onclick="bookRide()">Confirm Ride</button>
  <button class="primary whatsapp" onclick="wa()">📲 Book via WhatsApp</button>

  <div id="statusBox" style="display:none"></div>
</div>

<script>
let vehicle="bike";
let fare=40;
let paymentMode="cash";
let rideId=null;
let pollTimer=null;

function setVehicle(v){
  vehicle=v;
  bike.classList.remove("active");
  auto.classList.remove("active");
  document.getElementById(v).classList.add("active");
}
function setFare(f){
  fare=f;
  document.querySelectorAll(".fares button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
}
function setPay(p){
  paymentMode=p;
  cash.classList.remove("active");
  upi.classList.remove("active");
  document.getElementById(p).classList.add("active");
}

function bookRide(){
  if(!pickup.value || !drop.value){
    return alert("Pickup & Drop required");
  }

  const distanceKm = Number(prompt("Approx distance (KM)?", 3));
  if(!distanceKm || distanceKm<=0) return;

  fetch("https://paliride.onrender.com/api/ride/create",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      pickup: pickup.value,
      drop: drop.value,
      vehicleType: vehicle,
      distanceKm,
      paymentMode
    })
  })
  .then(r=>r.json())
  .then(d=>{
    rideId=d.rideId;
    statusBox.style.display="block";
    statusBox.innerHTML="🔍 Searching for driver...";
    pollTimer=setInterval(poll,4000);
  });
}

function poll(){
  if(!rideId) return;
  fetch(`https://paliride.onrender.com/api/ride/status/${rideId}`)
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d) return;
      statusBox.innerHTML=
        `Status: <b>${d.status}</b><br>
         Fare: ₹${d.fare}<br>
         Payment: ${d.paymentMode}`;

      if(d.status==="completed"){
        statusBox.innerHTML+="<br>✅ Ride completed";
        clearInterval(pollTimer);
      }
    })
    .catch(()=>{});
}

function wa(){
  const msg=
`Pali Ride Booking
Pickup: ${pickup.value}
Drop: ${drop.value}
Vehicle: ${vehicle}
Payment: ${paymentMode}`;
  window.open(`https://wa.me/91XXXXXXXXXX?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
